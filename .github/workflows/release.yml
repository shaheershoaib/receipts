name: release

# Publishing is a claim like any other: it asserts "this tag is what is on npm".
# So the tag must agree with the manifests, and the full gate must be green, BEFORE
# anything is pushed to the registry - no publishing a version nobody verified.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance - a verifiable link from the tarball back to this run

jobs:
  publish:
    name: verify, then publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: deliberately NO `registry-url`. setup-node writes an .npmrc containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`; with no token in the
      # environment that becomes an EMPTY credential, and npm sends it instead of falling
      # through to OIDC - which the registry answers with a 404 that reads like the package
      # does not exist. Trusted publishing needs only `id-token: write`, and the default
      # registry is npmjs.org anyway.
      - uses: actions/setup-node@v4
        with:
          # 24, not 20: trusted publishing needs npm >= 11.5.1 (node 20 ships 10.x) and
          # node >= 22.14.
          node-version: '24'

      # Pinned to ^11, NOT @latest: npm 12 requires node ^22.22 || ^24.15 || >=26, so
      # `npm@latest` resolves to something the runner's node may not satisfy - which is
      # exactly how the first v0.5.0 release attempt died (EBADENGINE, npm 12 on node 20).
      - name: npm new enough for trusted publishing
        run: npm install -g npm@^11 && npm --version

      # The three manifests are already kept in lockstep by a unit test; this checks the
      # fourth leg the test cannot see - the tag actually being cut.
      - name: tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag disagrees with package.json $pkg - bump all three manifests and re-tag"
            exit 1
          fi
          echo "tag v$tag matches package.json"

      - name: refuse to republish an existing version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if npm view "receipts-cli@$pkg" version >/dev/null 2>&1; then
            echo "::error::receipts-cli@$pkg is already on the registry - bump the version"
            exit 1
          fi
          echo "receipts-cli@$pkg is not yet published"

      - name: enforcer self-verification suite
        run: npm test

      - name: stop-hook + plugin tests
        run: node --test plugin/hooks/test/*.test.mjs plugin/mcp/trajectory-kb/test/*.test.mjs

      - name: gates-bench (weak-agent matrix)
        run: node bench/run.js

      # Trusted publishing: npm mints a short-lived credential from this run's OIDC identity,
      # so there is no token to leak, rotate, or lose. Configure the trusted publisher once on
      # npmjs.com (package -> Settings -> Trusted Publisher -> GitHub Actions, workflow
      # release.yml). npm is retiring 2FA-bypass tokens for direct publishing in January 2027,
      # so this is the path that keeps working.
      - name: publish
        run: npm publish --provenance --access public
